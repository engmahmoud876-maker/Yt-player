<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مشغل ومحمل الصوتيات</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --primary: #ff0000;
      --text: #ffffff;
      --subtext: #aaaaaa;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 16px;
      text-align: center;
      background-color: var(--card-bg);
      font-weight: bold;
      font-size: 1.1rem;
      border-bottom: 1px solid #2a2a2a;
    }
    .search-box {
      display: flex;
      padding: 12px 16px;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #242424;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    button.btn {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background-color: var(--primary);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .results-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 120px 16px;
    }
    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: var(--card-bg);
      margin-bottom: 8px;
      border-radius: 8px;
    }
    .thumb {
      width: 50px;
      height: 50px;
      border-radius: 6px;
      object-fit: cover;
      background: #333;
    }
    .info {
      flex: 1;
      overflow: hidden;
    }
    .title {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .author {
      font-size: 12px;
      color: var(--subtext);
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    .action-btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      cursor: pointer;
    }
    .play-btn {
      background: #333;
      color: white;
    }
    .download-btn {
      background: #27ae60;
      color: white;
    }
    .player-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      border-top: 1px solid #282828;
      padding: 12px 16px;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
    }
    .now-playing {
      font-size: 13px;
      color: var(--text);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    audio {
      width: 100%;
      height: 40px;
    }
    .status-msg {
      text-align: center;
      color: var(--subtext);
      font-size: 13px;
      padding: 15px;
    }
  </style>
</head>
<body>

  <header>مشغل ومحمل الصوتيات</header>

  <div class="search-box">
    <input type="text" id="query" placeholder="ابحث عن أغنية أو فنان..." />
    <button class="btn" onclick="searchAudio()">بحث</button>
  </div>

  <div class="results-list" id="results">
    <div class="status-msg">ابحث للاستماع وتحميل المقاطع</div>
  </div>

  <div class="player-dock">
    <div class="now-playing" id="nowPlaying">لم يتم تشغيل أي مقطع بعد</div>
    <audio id="audioPlayer" controls></audio>
  </div>

  <script>
    const PIPED_API = "https://pipedapi.kavin.rocks";
    const player = document.getElementById("audioPlayer");
    const nowPlaying = document.getElementById("nowPlaying");
    const resultsContainer = document.getElementById("results");

    async function searchAudio() {
      const q = document.getElementById("query").value.trim();
      if (!q) return;

      resultsContainer.innerHTML = '<div class="status-msg">جاري البحث...</div>';

      try {
        const res = await fetch(`${PIPED_API}/search?q=${encodeURIComponent(q)}&filter=music_songs`);
        const data = await res.json();
        const items = data.items || [];

        if (items.length === 0) {
          resultsContainer.innerHTML = '<div class="status-msg">لا توجد نتائج مطابقة</div>';
          return;
        }

        resultsContainer.innerHTML = "";
        items.forEach(item => {
          if (!item.url) return;
          const videoId = item.url.replace("/watch?v=", "");
          
          const div = document.createElement("div");
          div.className = "track-item";
          div.innerHTML = `
            <img class="thumb" src="${item.thumbnail}" alt="" />
            <div class="info">
              <div class="title">${item.title}</div>
              <div class="author">${item.uploaderName || ""}</div>
            </div>
            <div class="actions">
              <button class="action-btn play-btn" onclick="fetchAndPlay('${videoId}', '${encodeURIComponent(item.title)}')">تشغيل</button>
              <button class="action-btn download-btn" onclick="fetchAndDownload('${videoId}', '${encodeURIComponent(item.title)}')">تحميل</button>
            </div>
          `;
          resultsContainer.appendChild(div);
        });
      } catch (err) {
        resultsContainer.innerHTML = '<div class="status-msg">تعذر جلب النتائج. جرب مجدداً.</div>';
      }
    }

    async function getAudioStreamUrl(videoId) {
      const res = await fetch(`${PIPED_API}/streams/${videoId}`);
      const data = await res.json();
      const audioStreams = data.audioStreams || [];
      if (audioStreams.length === 0) throw new Error("لا يوجد مسار صوتي");
      audioStreams.sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0));
      return audioStreams[0].url;
    }

    async function fetchAndPlay(videoId, title) {
      const cleanTitle = decodeURIComponent(title);
      nowPlaying.innerText = `جاري التحميل: ${cleanTitle}...`;
      try {
        const streamUrl = await getAudioStreamUrl(videoId);
        player.src = streamUrl;
        nowPlaying.innerText = cleanTitle;
        player.play();

        if ("mediaSession" in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: cleanTitle,
            artist: "YouTube Audio"
          });
        }
      } catch (e) {
        nowPlaying.innerText = "تعذر تشغيل هذا المقطع";
      }
    }

    async function fetchAndDownload(videoId, title) {
      const cleanTitle = decodeURIComponent(title);
      try {
        const streamUrl = await getAudioStreamUrl(videoId);
        const link = document.createElement("a");
        link.href = streamUrl;
        link.download = `${cleanTitle}.m4a`;
        link.target = "_blank";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (e) {
        alert("تعذر جلب رابط التحميل");
      }
    }
  </script>
</body>
      </html>
